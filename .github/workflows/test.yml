name: offline-tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  bash:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false
      - name: Install offline test dependencies
        run: sudo apt-get update && sudo apt-get install -y jq ripgrep shellcheck xxd
      - name: Syntax
        run: |
          bash -n bin/jbl-aura-link tests/test.sh tests/session_test.sh tests/privacy.sh tests/fixtures/*
          python3 -m py_compile lib/jbl_aura_session.py
      - name: ShellCheck
        run: shellcheck -x bin/jbl-aura-link tests/test.sh tests/session_test.sh tests/privacy.sh tests/fixtures/*
      - name: Protocol and transport mocks
        run: |
          ./tests/test.sh
          PYTHON_BIN=python3 ./tests/session_test.sh
      - name: Public-data privacy guard
        run: ./tests/privacy.sh
