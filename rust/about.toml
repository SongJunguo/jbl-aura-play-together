# `cargo-about` produces the distributable third-party notice.  This is
# intentionally separate from deny.toml: cargo-deny enforces policy but does
# not preserve the license texts required by a release.
accepted = [
  "Apache-2.0",
  "BSD-2-Clause",
  "BSL-1.0",
  "MIT",
  "Unicode-3.0",
]
targets = ["x86_64-unknown-linux-gnu"]
ignore-build-dependencies = false
ignore-dev-dependencies = true
ignore-transitive-dependencies = false

[private]
# Exclude the unpublished workspace package itself from the third-party
# notice. Its own MIT license is distributed separately at repository root.
ignore = true

# BlueR's packaged LICENSE concatenates its code license, a database license
# used only by the disabled `id` feature, and a documentation license.  The
# Ubuntu release enables `bluetoothd` only.  Pin the exact upstream file and
# preserve the code's real copyright notice instead of cargo-about's generic
# BSD template.
[bluer.clarify]
license = "BSD-2-Clause"

[[bluer.clarify.files]]
path = "LICENSE"
license = "BSD-2-Clause"
checksum = "435a7c8b305a868bd5207aa52ce77ad8cb8c7d666f2a2055042e868a93fa96f8"
start = "Copyright (c) 2021-2024, Sebastian Urban"
end = "SOFTWARE, EVEN IF ADVISED OF THE POSSIBILITY OF SUCH DAMAGE."
