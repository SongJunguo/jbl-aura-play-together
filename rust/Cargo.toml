[package]
name = "jbl-aura-link"
version = "0.5.0-alpha.1"
edition = "2021"
rust-version = "1.96"
license = "MIT"
publish = false
description = "Cross-platform JBL Authentics 300 and Aura Studio 5 association verifier"
repository = "https://github.com/SongJunguo/jbl-aura-play-together"

[dependencies]
bluer = { version = "=0.17.4", features = ["bluetoothd", "l2cap"] }
# The development host intentionally has no libdbus-1-dev.  Enabling the
# vendored feature on the same dbus crate used by bluer keeps the release gate
# independent of host D-Bus headers while still talking to system bluetoothd.
dbus = { version = "=0.9.10", features = ["vendored"] }
futures = { version = "=0.3.31", default-features = false, features = ["async-await", "std"] }
libc = "=0.2.189"
openssl = { version = "=0.10.81", features = ["vendored"] }
roxmltree = "=0.20.0"
serde = { version = "=1.0.203", features = ["derive"] }
serde_json = "=1.0.117"
sha2 = "=0.10.8"
tokio = { version = "=1.48.0", features = ["macros", "rt", "sync", "time"] }
ureq = { version = "=2.9.1", default-features = false }
# Pin the audited URL line that resolves to idna 1.1.x; older idna versions are
# also denied in deny.toml because of RUSTSEC-2024-0421.
url = "=2.5.8"
zeroize = "=1.8.1"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = "s"
panic = "abort"
strip = "symbols"
